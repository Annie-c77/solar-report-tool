                `);
            }

            dat.customFields.forEach(cf => {
                if (cf.checked) {
                    rows.push(`
                        <tr>
                            <th style="width: 20%;">${escapeHtml(cf.label)}:</th>
                            <td colspan="3" style="text-align: left; padding-left: 8px;">${escapeHtml(cf.value || '')}</td>
                        </tr>
                    `);
                }
            });

            if (rows.length > 0) {
                html += `<table class="eng-table"><tbody>${rows.join('')}</tbody></table>`;
            }

            return html;
        }

        function buildPhotoCellHtml(photo, globalIdx, allPhotos) {
            const cell = document.createElement('div');
            cell.className = 'photo-cell';
            cell.draggable = !!photo.src;

            // 拖曳排序事件綁定
            cell.ondragstart = (e) => {
                draggedPhotoIndex = globalIdx;
                cell.classList.add('dragging');
                e.dataTransfer.setData('text/plain', String(globalIdx));
            };

            cell.ondragend = () => {
                cell.classList.remove('dragging');
                document.querySelectorAll('.photo-cell').forEach(c => c.classList.remove('drag-hover'));
                draggedPhotoIndex = null;
            };

            cell.ondragover = (e) => {
                e.preventDefault();
                cell.classList.add('drag-hover');
            };

            cell.ondragleave = () => {
                cell.classList.remove('drag-hover');
            };

            cell.ondrop = async (e) => {
                e.preventDefault();
                cell.classList.remove('drag-hover');

                // 外部檔案拖放進個別格子
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
                    if (files.length > 0) {
                        saveSnapshot();
                        for (let f = 0; f < files.length; f++) {
                            const targetIdx = globalIdx + f;
                            const dataUrl = await readFileAsDataUrl(files[f]);
                            const prefix = currentModule === 'daily' ? '說明:' : '';
                            if (targetIdx < allPhotos.length) {
                                allPhotos[targetIdx].src = dataUrl;
                                if (!allPhotos[targetIdx].caption) allPhotos[targetIdx].caption = `${prefix}施工照片`;
                            } else {
                                allPhotos.push({ src: dataUrl, caption: `${prefix}施工照片` });
                            }
                        }
                        renderPreviewPages();
                        return;
                    }
                }

                // 內部照片拖曳交換位置
                if (draggedPhotoIndex !== null && draggedPhotoIndex !== globalIdx) {
                    saveSnapshot();
                    const temp = { ...allPhotos[draggedPhotoIndex] };
                    allPhotos[draggedPhotoIndex] = { ...allPhotos[globalIdx] };
                    allPhotos[globalIdx] = temp;
                    renderPreviewPages();
                }
            };

            // 內部照片圖片容器
            const imgWrap = document.createElement('div');
            imgWrap.className = 'photo-img-wrap';
            imgWrap.onclick = () => {
                pendingUploadSlotIndex = globalIdx;
                document.getElementById('single-file-input').click();
            };

            if (photo.src) {
                imgWrap.innerHTML = `
                    <div class="drag-handle-badge"><i class="fa-solid fa-up-down-left-right"></i> 拖曳交換</div>
                    <img src="${photo.src}" class="photo-img">
                `;
            } else {
                imgWrap.innerHTML = `
                    <div class="empty-slot-hint">
                        <i class="fa-solid fa-plus"></i>
                        <span>點擊或拖放照片</span>
                    </div>
                `;
            }

            // 說明輸入欄
            const capBar = document.createElement('div');
            capBar.className = 'photo-caption-bar';
            const capInput = document.createElement('input');
            capInput.type = 'text';
            capInput.className = 'photo-caption-input';
            capInput.value = photo.caption || '';
            capInput.onfocus = () => { lastFocusedCaptionIndex = globalIdx; };
            capInput.oninput = (e) => { photo.caption = e.target.value; };

            capBar.appendChild(capInput);
            cell.appendChild(imgWrap);
            cell.appendChild(capBar);
            return cell;
        }

        async function handleSingleFileSelect(event) {
            if (pendingUploadSlotIndex === null) return;
            if (event.target.files && event.target.files.length > 0) {
                saveSnapshot();
                const targetPhotos = currentModule === 'daily'
                    ? dailyDaysData[activeDailyDayIndex].photos
                    : acceptanceData.photos;

                const file = event.target.files[0];
                const dataUrl = await readFileAsDataUrl(file);
                const prefix = currentModule === 'daily' ? '說明:' : '';

                if (pendingUploadSlotIndex < targetPhotos.length) {
                    targetPhotos[pendingUploadSlotIndex].src = dataUrl;
                    if (!targetPhotos[pendingUploadSlotIndex].caption) {
                        targetPhotos[pendingUploadSlotIndex].caption = `${prefix}施工照片`;
                    }
                }
                event.target.value = '';
                pendingUploadSlotIndex = null;
                renderPreviewPages();
            }
        }

        async function processIncomingDocFiles(fileList) {
            const overlay = document.getElementById('loading-overlay');
            const loadingText = document.getElementById('loading-text');
            overlay.style.display = 'flex';

            const target = currentModule === 'daily' ? dailyDaysData[activeDailyDayIndex] : acceptanceData;
            if (!target.extraDocs) target.extraDocs = [];

            const files = Array.from(fileList);

            for (let fIdx = 0; fIdx < files.length; fIdx++) {
                const file = files[fIdx];
                loadingText.textContent = `正在處理單據 (${fIdx + 1}/${files.length}): ${file.name}...`;

                if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                    // 若輸入的檔案是 PDF 就依照原始檔案每頁加入，說明預設留空
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        const numPages = pdfDoc.numPages;

                        for (let pNum = 1; pNum <= numPages; pNum++) {
                            loadingText.textContent = `解析 PDF 頁面: 第 ${pNum}/${numPages} 頁...`;
                            const page = await pdfDoc.getPage(pNum);
                            const viewport = page.getViewport({ scale: 2.0 }); // 2x 確保單據高清晰度
                            const canvas = document.createElement('canvas');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            const ctx = canvas.getContext('2d');
                            await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                            const pageDataUrl = canvas.toDataURL('image/jpeg', 0.92);

                            // 每個照片或文件的說明預設留空
                            target.extraDocs.push({
                                src: pageDataUrl,
                                title: ''
                            });
                        }
                    } catch (err) {
                        console.error('PDF 解析失敗:', err);
                        alert(`檔案 ${file.name} 解析失敗，請確認檔案是否受密碼保護。`);
                    }
                } else if (file.type.startsWith('image/')) {
                    // 一般圖片直接轉 DataURL，說明預設留空
                    const dataUrl = await readFileAsDataUrl(file);
                    target.extraDocs.push({
                        src: dataUrl,
                        title: ''
                    });
                }
            }

            overlay.style.display = 'none';
            renderExtraDocsSidebarList();
            renderPreviewPages();
        }

        function applyTagToCaption(text) {
            const targetPhotos = currentModule === 'daily'
                ? dailyDaysData[activeDailyDayIndex].photos
                : acceptanceData.photos;

            if (lastFocusedCaptionIndex !== null && targetPhotos[lastFocusedCaptionIndex]) {
                const prefix = currentModule === 'daily' ? '說明:' : '';
                targetPhotos[lastFocusedCaptionIndex].caption = prefix + text;
                renderPreviewPages();
            }
        }

        /**
         * 原生 Canvas 高解析度向量級 PDF 產出引擎
         * 徹底保證：標楷體、文字幾何垂直置中、照片保持長寬比、續頁上下左右完全置中
         */
        async function exportToPdfCanvas() {
            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = 'flex';

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const A4_W = 210;
                const A4_H = 297;

                // 準備欲產出的頁面清單
                const pagesToExport = [];
                const perPage = currentGridMode === '3x2' ? 6 : 9;

                if (currentModule === 'daily') {
                    dailyDaysData.forEach((day, dIdx) => {
                        // 1. 照片頁
                        const totalP = Math.max(1, Math.ceil(day.photos.length / perPage));
                        for (let p = 0; p < totalP; p++) {
                            pagesToExport.push({
                                type: 'photo',
                                module: 'daily',
                                dayData: day,
                                pageIdx: p,
                                isFirstPageOfDay: p === 0,
                                photos: day.photos.slice(p * perPage, (p + 1) * perPage)
                            });
                        }
                        // 2. 插入的其他單據頁 (在施工照片之後)
                        const extraDocs = day.extraDocs || [];
                        const docsPerPage = parseInt(day.docsPerPage || 1, 10);
                        if (extraDocs.length > 0) {
                            const totalDocPages = Math.ceil(extraDocs.length / docsPerPage);
                            for (let dp = 0; dp < totalDocPages; dp++) {
                                pagesToExport.push({
                                    type: 'doc',
                                    module: 'daily',
                                    dayData: day,
                                    docPageIdx: dp,
                                    totalDocPages: totalDocPages,
                                    docsPerPage: docsPerPage,
                                    docs: extraDocs.slice(dp * docsPerPage, (dp + 1) * docsPerPage)
                                });
                            }
                        }
                    });
                } else {
                    // 工程驗收報告
                    // 1. 照片頁
                    const totalP = Math.max(1, Math.ceil(acceptanceData.photos.length / perPage));
                    for (let p = 0; p < totalP; p++) {
                        pagesToExport.push({
                            type: 'photo',
                            module: 'accept',
                            data: acceptanceData,
                            pageIdx: p,
                            isFirstPageOfDoc: p === 0,
                            photos: acceptanceData.photos.slice(p * perPage, (p + 1) * perPage)
                        });
                    }
                    // 2. 插入的其他單據頁 (在施工照片之後)
                    const extraDocs = acceptanceData.extraDocs || [];
                    const docsPerPage = parseInt(acceptanceData.docsPerPage || 1, 10);
                    if (extraDocs.length > 0) {
                        const totalDocPages = Math.ceil(extraDocs.length / docsPerPage);
                        for (let dp = 0; dp < totalDocPages; dp++) {
                            pagesToExport.push({
                                type: 'doc',
                                module: 'accept',
                                data: acceptanceData,
                                docPageIdx: dp,
                                totalDocPages: totalDocPages,
                                docsPerPage: docsPerPage,
                                docs: extraDocs.slice(dp * docsPerPage, (dp + 1) * docsPerPage)
                            });
                        }
                    }
                }

                // 依序以 300 DPI Canvas 繪製每頁
                for (let i = 0; i < pagesToExport.length; i++) {
                    document.getElementById('loading-text').textContent = `正在產出第 ${i + 1} / ${pagesToExport.length} 頁...`;
                    const pageMeta = pagesToExport[i];

                    const canvas = document.createElement('canvas');
                    canvas.width = 2480;
                    canvas.height = 3508;
                    const ctx = canvas.getContext('2d');

                    // 繪製白色底
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // 繪製內容 (依類型區分：照片頁 或 單據頁)
                    if (pageMeta.type === 'doc') {
                        await drawDocPageOnCanvas(ctx, pageMeta, canvas.width, canvas.height);
                    } else {
                        await drawPageOnCanvas(ctx, pageMeta, canvas.width, canvas.height);
                    }

                    const imgData = canvas.toDataURL('image/jpeg', 0.95);
                    if (i > 0) pdf.addPage('a4', 'p');
                    pdf.addImage(imgData, 'JPEG', 0, 0, A4_W, A4_H);
                }

                const fileName = currentModule === 'daily'
                    ? `施工日誌_${dailyDaysData[0].siteName || '工程'}.pdf`
                    : `工程驗收報告_${acceptanceData.docTitle || '驗收'}.pdf`;

                pdf.save(fileName);
            } catch (err) {
                console.error(err);
                alert('匯出 PDF 時發生錯誤，請稍後再試或使用列印功能！');
            } finally {
                overlay.style.display = 'none';
            }
        }

        /**
         * Canvas 頁面繪製核心函式 (照片頁)
         */
        async function drawPageOnCanvas(ctx, meta, cW, cH) {
            const FONT_KAI = '"標楷體", "DFKai-SB", "BiauKai", "TW-Kai", serif';
            const marginX = 177; // 15mm 邊距
            const marginY = 142; // 12mm 邊距
            const contentW = cW - marginX * 2;
            let curY = marginY;

            ctx.fillStyle = '#000000';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;

            const isContinuation = (meta.module === 'daily' && !meta.isFirstPageOfDay) || 
                                   (meta.module === 'accept' && !meta.isFirstPageOfDoc);

            // 照片九宮格 / 六宮格標準高度設定
            const bannerH = 65;
            const gridH = 2338; // 約 198mm 在 300 DPI 下之高度
            const totalBlockH = bannerH + gridH;

            if (isContinuation) {
                // 續頁模式：整塊照片區域（橫幅 + 照片格子）在 A4 畫布高度中上下完全垂直置中
                curY = (cH - totalBlockH) / 2;
            } else {
                // 1. 繪製首頁表頭
                if (meta.module === 'daily' && meta.isFirstPageOfDay) {
                    const day = meta.dayData;
                    const ch = day.checks || {};

                    // (a) 標題
                    if (ch.docTitle !== false && day.docTitle) {
                        ctx.font = `bold 64px ${FONT_KAI}`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(day.docTitle, cW / 2, curY + 36);
                        curY += 80;
                    }

                    // (b) 表頭資料表格
                    const rowH = 70;
                    const rowsData = [];

                    if (ch.siteName !== false && ch.dateObj !== false) {
                        rowsData.push([
                            { txt: '案場名稱', w: 0.18, isHeader: true },
                            { txt: day.siteName, w: 0.32, isHeader: false, align: 'left' },
                            { txt: '施工日期:', w: 0.18, isHeader: true },
                            { txt: formatDateText(day.dateObj), w: 0.32, isHeader: false, align: 'left' }
                        ]);
                    } else if (ch.siteName !== false) {
                        rowsData.push([
                            { txt: '案場名稱', w: 0.18, isHeader: true },
                            { txt: day.siteName, w: 0.82, isHeader: false, align: 'left', colspan: 3 }
                        ]);
                    } else if (ch.dateObj !== false) {
                        rowsData.push([
                            { txt: '施工日期:', w: 0.18, isHeader: true },
                            { txt: formatDateText(day.dateObj), w: 0.82, isHeader: false, align: 'left', colspan: 3 }
                        ]);
                    }

                    if (ch.siteAddress !== false) {
                        rowsData.push([
                            { txt: '案場地址', w: 0.18, isHeader: true },
                            { txt: day.siteAddress, w: 0.82, isHeader: false, align: 'left', colspan: 3 }
                        ]);
                    }

                    day.customFields.forEach(cf => {
                        if (cf.checked) {
                            rowsData.push([
                                { txt: cf.label, w: 0.18, isHeader: true },
                                { txt: cf.value || '', w: 0.82, isHeader: false, align: 'left', colspan: 3 }
                            ]);
                        }
                    });

                    if (rowsData.length > 0) {
                        curY = drawCanvasTable(ctx, marginX, curY, contentW, rowH, rowsData, FONT_KAI, 32);
                    }

                    // (c) 施工項目明細表格
                    if (day.showWorkItems !== false && day.workItems && day.workItems.length > 0) {
                        const itemRowH = 65;
                        const itemHeader = [
                            { txt: '施工項目', w: 0.32, isHeader: true },
                            { txt: '施工人數', w: 0.10, isHeader: true },
                            { txt: '使用機具', w: 0.12, isHeader: true },
                            { txt: '機具數量\n作業時間', w: 0.12, isHeader: true },
                            { txt: '材料名稱', w: 0.22, isHeader: true },
                            { txt: '材料數量', w: 0.12, isHeader: true }
                        ];
                        const itemRows = [itemHeader];
                        day.workItems.forEach(wi => {
                            itemRows.push([
                                { txt: wi.item, w: 0.32 },
                                { txt: wi.workers, w: 0.10 },
                                { txt: wi.tool, w: 0.12 },
                                { txt: wi.duration, w: 0.12 },
                                { txt: wi.material, w: 0.22 },
                                { txt: wi.qty, w: 0.12 }
                            ]);
                        });

                        curY = drawCanvasTable(ctx, marginX, curY - 3, contentW, itemRowH, itemRows, FONT_KAI, 28);
                        curY += 6;
                    }
                } else if (meta.module === 'accept' && meta.isFirstPageOfDoc) {
                    const dat = meta.data;
                    const ch = dat.checks;

                    if (ch.docTitle) {
                        ctx.font = `bold 64px ${FONT_KAI}`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(dat.docTitle, cW / 2, curY + 36);
                        curY += 80;
                    }

                    const rowH = 70;
                    const rowsData = [];

                    if (ch.contractor && ch.acceptDate) {
                        rowsData.push([
                            { txt: '維運/施工廠商:', w: 0.20, isHeader: true },
                            { txt: dat.contractor, w: 0.35, isHeader: false, align: 'left' },
                            { txt: '驗收日:', w: 0.15, isHeader: true },
                            { txt: formatDateText(dat.acceptDate), w: 0.30, isHeader: false, align: 'left' }
                        ]);
                    } else if (ch.contractor) {
                        rowsData.push([
                            { txt: '維運/施工廠商:', w: 0.20, isHeader: true },
                            { txt: dat.contractor, w: 0.80, isHeader: false, align: 'left', colspan: 3 }
                        ]);
                    }

                    if (ch.siteCapacity && ch.periodDate) {
                        rowsData.push([
                            { txt: '案場/容量:', w: 0.20, isHeader: true },
                            { txt: dat.siteCapacity, w: 0.35, isHeader: false, align: 'left' },
                            { txt: '起訖日:', w: 0.15, isHeader: true },
                            { txt: formatDateRangeText(dat.periodDate), w: 0.30, isHeader: false, align: 'left' }
                        ]);
                    }

                    if (ch.remarks) {
                        rowsData.push([
                            { txt: '備註:', w: 0.20, isHeader: true },
                            { txt: dat.remarks || '', w: 0.80, isHeader: false, align: 'left', colspan: 3 }
                        ]);
                    }

                    dat.customFields.forEach(cf => {
                        if (cf.checked) {
                            rowsData.push([
                                { txt: cf.label + ':', w: 0.20, isHeader: true },
                                { txt: cf.value || '', w: 0.80, isHeader: false, align: 'left', colspan: 3 }
                            ]);
                        }
                    });

                    if (rowsData.length > 0) {
                        curY = drawCanvasTable(ctx, marginX, curY, contentW, rowH, rowsData, FONT_KAI, 32);
                        curY += 6;
                    }
                }
            }

            // 2. 照片橫幅標題 (支援自訂文字)
            const bannerText = (meta.module === 'daily' ? meta.dayData.photoBannerText : meta.data.photoBannerText) || '施工照片暨說明：';
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(marginX, curY, contentW, bannerH);
            ctx.strokeRect(marginX, curY, contentW, bannerH);

            ctx.fillStyle = '#000000';
            ctx.font = `bold 32px ${FONT_KAI}`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(bannerText, marginX + 20, curY + bannerH / 2);
            curY += bannerH;

            // 3. 照片九宮格 / 六宮格繪製
            const cols = currentGridMode === '3x2' ? 2 : 3;
            const rows = 3;
            const colW = contentW / cols;
            const rowH = gridH / rows;
            const captionH = 55;

            const photosToDraw = meta.photos;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const slotIdx = r * cols + c;
                    const cellX = marginX + c * colW;
                    const cellY = curY + r * rowH;
                    const photo = photosToDraw[slotIdx];

                    // 外框格線
                    ctx.strokeRect(cellX, cellY, colW, rowH);

                    // 說明列框線與文字
                    const capY = cellY + rowH - captionH;
                    ctx.strokeRect(cellX, capY, colW, captionH);

                    if (photo && photo.caption) {
                        ctx.fillStyle = '#000000';
                        ctx.font = `normal 28px ${FONT_KAI}`;
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(photo.caption, cellX + 14, capY + captionH / 2);
                    }

                    // 繪製照片（若有上傳）；空白格完全純白留空
                    if (photo && photo.src) {
                        try {
                            const img = await loadImageAsync(photo.src);
                            const imgAreaW = colW - 16;
                            const imgAreaH = (rowH - captionH) - 16;
                            const areaX = cellX + 8;
                            const areaY = cellY + 8;

                            const hRatio = imgAreaW / img.width;
                            const vRatio = imgAreaH / img.height;
                            const ratio = Math.min(hRatio, vRatio);

                            const finalW = img.width * ratio;
                            const finalH = img.height * ratio;
                            const finalX = areaX + (imgAreaW - finalW) / 2;
                            const finalY = areaY + (imgAreaH - finalH) / 2;

                            ctx.drawImage(img, finalX, finalY, finalW, finalH);
                        } catch (err) {
                            console.warn('圖片載入失敗，略過繪製:', err);
                        }
                    }
                }
            }
        }

        /**
         * Canvas 繪製「插入單據頁」核心函式
         * 支援 1~4 份單據排版，保持長寬比，空白格純白留空
         */
        async function drawDocPageOnCanvas(ctx, meta, cW, cH) {
            const FONT_KAI = '"標楷體", "DFKai-SB", "BiauKai", "TW-Kai", serif';
            const marginX = 177;
            const marginY = 142;
            const contentW = cW - marginX * 2;
            const contentH = cH - marginY * 2;
            let curY = marginY;

            ctx.fillStyle = '#000000';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;

            // 1. 繪製橫幅標題 (起始標題預設為空白；若有填寫才繪製)
            const docData = meta.module === 'daily' ? meta.dayData : meta.data;
            const userDocTitle = (docData.docsTitle || '').trim();
            const bannerH = 65;

            if (userDocTitle) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(marginX, curY, contentW, bannerH);
                ctx.strokeRect(marginX, curY, contentW, bannerH);

                ctx.fillStyle = '#000000';
                ctx.font = `bold 32px ${FONT_KAI}`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                const bannerTitle = `${userDocTitle} (第 ${meta.docPageIdx + 1} 頁，共 ${meta.totalDocPages} 頁)：`;
                ctx.fillText(bannerTitle, marginX + 20, curY + bannerH / 2);
                curY += bannerH;
            }

            // 2. 繪製單據排版網格 (1~4 份)
            const gridH = userDocTitle ? (contentH - bannerH) : contentH;
            const docsPerPage = meta.docsPerPage || 1;
            const docs = meta.docs;

            let cols = 1;
            let rows = 1;
            if (docsPerPage === 2) { cols = 1; rows = 2; }
            else if (docsPerPage === 3) { cols = 1; rows = 3; }
            else if (docsPerPage === 4) { cols = 2; rows = 2; }

            const colW = contentW / cols;
            const rowH = gridH / rows;
            const captionH = 55;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const idx = r * cols + c;
                    const cellX = marginX + c * colW;
                    const cellY = curY + r * rowH;
                    const docItem = docs[idx];

                    // 外框格線
                    ctx.strokeRect(cellX, cellY, colW, rowH);

                    // 說明列
                    const capY = cellY + rowH - captionH;
                    ctx.strokeRect(cellX, capY, colW, captionH);

                    if (docItem) {
                        if (docItem.title) {
                            ctx.fillStyle = '#000000';
                            ctx.font = `normal 28px ${FONT_KAI}`;
                            ctx.textAlign = 'left';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(docItem.title, cellX + 14, capY + captionH / 2);
                        }

                        // 繪製單據影像（保持原始比例）
                        if (docItem.src) {
                            try {
                                const img = await loadImageAsync(docItem.src);
                                const imgAreaW = colW - 24;
                                const imgAreaH = (rowH - captionH) - 24;
                                const areaX = cellX + 12;
                                const areaY = cellY + 12;

                                const hRatio = imgAreaW / img.width;
                                const vRatio = imgAreaH / img.height;
                                const ratio = Math.min(hRatio, vRatio);

                                const finalW = img.width * ratio;
                                const finalH = img.height * ratio;
                                const finalX = areaX + (imgAreaW - finalW) / 2;
                                const finalY = areaY + (imgAreaH - finalH) / 2;

                                ctx.drawImage(img, finalX, finalY, finalW, finalH);
                            } catch (err) {
                                console.warn('單據圖片載入失敗:', err);
                            }
                        }
                    }
                }
            }
        }

        /**
         * Canvas 表格繪製輔助工具（幾何垂直精準置中）
         */
        function drawCanvasTable(ctx, startX, startY, totalW, rowH, rows, fontFam, fontSize) {
            let y = startY;

            rows.forEach(rowCols => {
                let x = startX;
                rowCols.forEach(col => {
                    const cellW = totalW * col.w;

                    // 填底與畫線
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(x, y, cellW, rowH);
                    ctx.strokeRect(x, y, cellW, rowH);

                    // 繪製文字 (幾何垂直置中)
                    ctx.fillStyle = '#000000';
                    ctx.font = `${col.isHeader ? 'bold' : 'normal'} ${fontSize}px ${fontFam}`;
                    ctx.textBaseline = 'middle';

                    const lines = String(col.txt || '').split('\n');
                    const lineH = fontSize * 1.25;
                    const totalTextH = lines.length * lineH;
                    const textStartY = y + (rowH - totalTextH) / 2 + lineH / 2;

                    lines.forEach((lineText, lIdx) => {
                        const curLineY = textStartY + lIdx * lineH;
                        if (col.align === 'left') {
                            ctx.textAlign = 'left';
                            ctx.fillText(lineText, x + 18, curLineY);
                        } else {
                            ctx.textAlign = 'center';
                            ctx.fillText(lineText, x + cellW / 2, curLineY);
                        }
                    });

                    x += cellW;
                });
                y += rowH;
            });

            return y;
        }

        function loadImageAsync(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
